<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DPYMS v2 - Danish Health Care (P) Ltd.</title>
  <link rel="stylesheet" href="style.css" />

  <!-- React 18 (Cloudflare CDN - works on all mobile networks) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel 6.26 - Most stable browser JSX compiler -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>

  <!-- Supabase for cloud sync -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="root">
    <div id="loading-screen" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0E2A5E;color:#fff;font-family:'Segoe UI',Arial,sans-serif;text-align:center;padding:24px;">
      <div id="spinner" style="width:60px;height:60px;border:4px solid rgba(255,255,255,0.2);border-top:4px solid #5FA8E0;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:24px;"></div>
      <h1 style="font-size:20px;font-weight:800;letter-spacing:1px;margin:0 0 8px;">DANISH HEALTH CARE (P) LTD.</h1>
      <p style="font-size:12px;color:rgba(255,255,255,0.65);text-transform:uppercase;letter-spacing:2px;margin:0 0 24px;">Digital Production Yield Management System</p>
      <p id="load-status" style="font-size:13px;color:#F59E0B;">⏳ Loading application…</p>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
  </div>

  <script>
    // If app.js doesn't load in 12 seconds, show a helpful error message
    setTimeout(function() {
      var status = document.getElementById('load-status');
      var spinner = document.getElementById('spinner');
      if (status && document.getElementById('loading-screen')) {
        if (spinner) spinner.style.borderTopColor = '#F87171';
        status.style.color = '#F87171';
        status.innerHTML = '❌ App failed to load. Please try:<br><br>' +
          '1. Open in <b>Incognito / Private window</b><br>' +
          '2. Use a <b>WiFi</b> connection instead of mobile data<br>' +
          '3. Press <b>Ctrl + Shift + R</b> (hard refresh)';
      }
    }, 12000);

    // Catch any global JS errors and display them
    window.onerror = function(msg, src, line) {
      var status = document.getElementById('load-status');
      if (status) {
        status.style.color = '#F87171';
        status.innerHTML = '❌ Error on line ' + line + ':<br><b>' + msg + '</b>';
      }
    };
  </script>

  <!-- Main app - Babel 6 compiles JSX with just type="text/babel" -->
  <script type="text/babel" src="app.js"></script>

</body>
</html>
